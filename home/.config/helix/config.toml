theme = "gruvbox_dark_hard"

# Keep theme colors over SSH/tmux even when COLORTERM is unset.
[editor]
true-color = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[keys.normal.space]
"=" = ":format"

[editor.inline-diagnostics]
cursor-line = "hint"  # Show diagnostics for the current line (options: "disable", "warning", "error", "hint")
other-lines = "disable" # Show diagnostics for other lines (usually set to "disable")
