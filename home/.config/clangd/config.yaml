# Global strict diagnostics for projects without a local configuration.
CompileFlags:
  Add: [-Weverything]

Diagnostics:
  UnusedIncludes: Strict
  MissingIncludes: Strict
  Includes:
    AnalyzeAngledIncludes: true
  ClangTidy:
    # Include slower checks such as const-correctness.
    FastCheckFilter: None
    Add: ["*"]

InlayHints:
  Enabled: true
  ParameterNames: true
  DeducedTypes: true
  Designators: true
  BlockEnd: true
