name: Nix tools shell
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned community Nix on disposable runner
        run: |
          curl -fsSL https://github.com/NixOS/nix-installer/releases/download/2.35.4/nix-installer-x86_64-linux -o "$RUNNER_TEMP/nix-installer"
          echo "60f39200fc2690bcf4da7ba3f8b2e4dee0118f487bc9f41cd4e153d1a02dce77  $RUNNER_TEMP/nix-installer" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/nix-installer"
          "$RUNNER_TEMP/nix-installer" install --no-confirm --no-modify-profile
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
      - name: Real Nix evaluation, build, packages and configs
        run: sh ./install.sh --command 'python3 "$DOTFILES_ROOT/tests/check-nix-tools" && python3 "$DOTFILES_ROOT/tests/test-nix-shell.py"'
      - name: Online snapshot entry path at this exact PR commit
        run: |
          export DOTFILES_REF="$GITHUB_SHA"
          sh -s -- --command 'python3 "$DOTFILES_ROOT/tests/check-nix-tools"' < install.sh
